[package]
name = "maple-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = "=2.0.0"
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0.0"
futures-util = "0.3.34"
maple-proxy = "=0.3.2"
notify = "8"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "io-util", "signal"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-markdown = "0.3.9"
uuid = { version = "1.26.0", features = ["v4"] }

[[bin]]
name = "maplet"
path = "src/main.rs"
